<!DOCTYPE html>
<html lang="ru" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Святой Коран - Чтение и Прослушивание</title>
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,300;0,700;1,700&family=Scheherazade+New&display=swap" rel="stylesheet">
    <style>
        :root{
            --primary:#0b6b4f; /* deep green */
            --accent:#c9a04b; /* gold */
            --muted:#f7efe2; /* parchment */
            --card:#fffdf8;
            --ink:#2b2b2b;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Merriweather', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(ellipse at top, rgba(11,107,79,0.08) 0%, transparent 40%), linear-gradient(180deg, #f2efe9 0%, #efe6da 100%);
            min-height: 100vh;
            padding: 28px;
            color: var(--ink);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: var(--muted);
            border-radius: 14px;
            box-shadow: 0 18px 40px rgba(11,107,79,0.08);
            overflow: hidden;
            border: 1px solid rgba(201,160,75,0.12);
        }

        .header {
            background: linear-gradient(180deg, var(--primary) 0%, rgba(11,107,79,0.9) 60%);
            color: var(--muted);
            padding: 48px 20px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .header:before{
            content: '';
            position: absolute;
            left: 0; right: 0; top: 0; bottom: -30px;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 200"><g fill="%23ffffff" opacity="0.04"><path d="M0 160 Q150 60 300 160 T600 160 T900 160 T1200 160 L1200 200 L0 200 Z"/></g></svg>');
            background-repeat: no-repeat;
            background-position: center bottom;
            pointer-events: none;
        }

        .header h1 {
            font-family: 'Scheherazade New', serif;
            font-size: 2.6em;
            margin-bottom: 6px;
            font-weight: 700;
            letter-spacing: 0.6px;
        }

        .header p {
            font-size: 1.05em;
            opacity: 0.95;
            color: rgba(255,255,255,0.95);
        }

        .surahs-selector {
            background: transparent;
            padding: 18px 22px;
            display: flex;
            gap: 16px;
            align-items: center;
            flex-wrap: wrap;
        }

        .search-section {
            padding: 10px 22px;
            display: flex;
            gap: 10px;
            align-items: center;
            border-top: 1px dashed rgba(11,107,79,0.04);
            background: transparent;
        }

        .btn-ghost{
            background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(201,160,75,0.02));
            border: 2px solid rgba(201,160,75,0.22);
            color: var(--primary);
            padding: 9px 16px;
            border-radius: 999px;
            box-shadow: 0 8px 20px rgba(11,107,79,0.04);
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: transform 0.16s ease, box-shadow 0.16s ease, background 0.16s ease;
            position: relative;
        }

        .btn-ghost:before{
            content: '';
            width: 6px;
            height: 6px;
            background: var(--accent);
            border-radius: 2px;
            display: inline-block;
            margin-left: 4px;
            box-shadow: 0 2px 6px rgba(11,107,79,0.06);
        }

        .btn-ghost:hover{
            transform: translateY(-3px);
            box-shadow: 0 18px 40px rgba(11,107,79,0.10);
            background: linear-gradient(180deg, rgba(255,255,255,0.04), rgba(201,160,75,0.06));
        }

        .surahs-selector label {
            font-weight: 600;
            color: #333;
            white-space: nowrap;
        }

        .surahs-selector select {
            padding: 10px 15px;
            border: 2px solid #667eea;
            border-radius: 8px;
            font-size: 0.95em;
            cursor: pointer;
            background: white;
            flex: 1;
            min-width: 300px;
        }

        .surahs-selector select:focus {
            outline: none;
            border-color: #764ba2;
            box-shadow: 0 0 10px rgba(102, 126, 234, 0.3);
        }

        .search-box {
            padding: 10px 15px;
            border: 2px solid #667eea;
            border-radius: 8px;
            font-size: 0.95em;
            min-width: 200px;
        }

        .search-box:focus {
            outline: none;
            border-color: #764ba2;
            box-shadow: 0 0 10px rgba(102, 126, 234, 0.3);
        }

        .surahs-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 12px;
            padding: 14px 20px;
            background: transparent;
            max-height: 240px;
            overflow-y: auto;
        }

        .surah-card {
            background: var(--card);
            border: 1px solid rgba(201,160,75,0.18);
            border-radius: 10px;
            padding: 14px 12px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.25s ease, box-shadow 0.25s ease;
            font-size: 0.95em;
            box-shadow: 0 6px 18px rgba(11,107,79,0.04);
        }

        .surah-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 12px 30px rgba(11,107,79,0.08);
            border-color: rgba(201,160,75,0.28);
        }

        .surah-card.active {
            background: linear-gradient(180deg, rgba(11,107,79,0.98), rgba(11,107,79,0.9));
            color: white;
            border-color: rgba(201,160,75,0.28);
        }

        .surah-card-number {
            display: block;
            font-weight: 700;
            font-size: 1.2em;
            margin-bottom: 5px;
        }

        .surah-card-name {
            display: block;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 6px;
            font-family: 'Scheherazade New', serif;
        }

        .surah-card-meaning {
            display: block;
            font-size: 0.75em;
            color: #666;
            font-style: italic;
            margin-top: 4px;
        }

        .surah-card.active .surah-card-meaning {
            color: rgba(255, 255, 255, 0.9);
        }

        .main-content {
            display: flex;
            flex-direction: column;
            min-height: 620px;
            padding-bottom: 30px;
        }

        .hidden { display: none !important; }

        .content-area {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
        }

        .controls {
            background: rgba(255,255,255,0.6);
            padding: 18px;
            border-radius: 10px;
            margin-bottom: 22px;
            display: flex;
            gap: 14px;
            align-items: center;
            flex-wrap: wrap;
            border: 1px solid rgba(11,107,79,0.04);
        }

        .controls label {
            font-weight: 600;
            color: #333;
        }

        .controls select {
            padding: 8px 12px;
            border: 2px solid #667eea;
            border-radius: 6px;
            font-size: 0.95em;
            cursor: pointer;
            background: white;
        }

        .youtube-link {
            margin-top: 15px;
        }

        .youtube-link a {
            display: inline-block;
            padding: 10px 20px;
            background: #ff0000;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .youtube-link a:hover {
            background: #cc0000;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 0, 0, 0.3);
        }

        .btn {
            padding: 10px 22px;
            background: linear-gradient(180deg, #fff4d6 0%, var(--accent) 70%);
            color: var(--primary);
            border: 2px solid rgba(11,107,79,0.12);
            border-radius: 999px;
            cursor: pointer;
            font-size: 0.96em;
            transition: transform 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
            font-weight: 700;
            box-shadow: inset 0 -4px 0 rgba(0,0,0,0.04), 0 10px 26px rgba(11,107,79,0.06);
            position: relative;
            overflow: visible;
            letter-spacing: 0.4px;
        }

        .btn:before,
        .btn:after {
            content: '';
            position: absolute;
            top: 50%;
            transform: translateY(-50%) rotate(45deg);
            width: 10px;
            height: 10px;
            background: linear-gradient(180deg, rgba(255,255,255,0.6), rgba(201,160,75,0.9));
            box-shadow: 0 2px 6px rgba(11,107,79,0.06);
            border-radius: 2px;
            opacity: 0.95;
        }

        .btn:before { left: 10px; }
        .btn:after { right: 10px; }

        .btn:hover {
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 18px 40px rgba(11,107,79,0.12), inset 0 -6px 0 rgba(0,0,0,0.05);
            background: linear-gradient(180deg, #fff7e0 0%, #d6b45a 70%);
        }

        .btn:active{
            transform: translateY(-1px) scale(0.995);
            box-shadow: 0 8px 20px rgba(11,107,79,0.08) inset;
        }

        .audio-player {
            width: 100%;
            margin: 15px 0;
        }

        .surah-title {
            text-align: center;
            margin-bottom: 30px;
        }

        .surah-title h2 {
            font-size: 2em;
            color: #667eea;
            margin-bottom: 8px;
        }

        .surah-info {
            text-align: center;
            color: #666;
            font-size: 0.95em;
            margin-top: 10px;
        }

        .surah-info span {
            display: inline-block;
            margin: 0 15px;
            padding: 5px 10px;
            background: #f0f0f0;
            border-radius: 4px;
        }

        .ayahs-container {
            line-height: 2;
            font-size: 1.1em;
        }

        .ayah {
            margin-bottom: 26px;
            padding: 18px;
            background: transparent;
            border-left: 6px solid rgba(201,160,75,0.22);
            border-radius: 6px;
            transition: background 0.2s ease, transform 0.18s ease;
        }

        .ayah:hover {
            background: rgba(11,107,79,0.03);
            transform: translateY(-4px);
        }

        .ayah-arabic {
            color: #0b3f33;
            margin-bottom: 10px;
            font-size: 1.35em;
            text-align: right;
            direction: rtl;
            font-weight: 600;
            font-family: 'Scheherazade New', serif;
            text-shadow: 0 1px 0 rgba(255,255,255,0.4);
        }

        .ayah-russian {
            color: #555;
            margin-bottom: 10px;
            font-size: 1em;
            text-align: left;
            direction: ltr;
            line-height: 1.6;
            padding: 10px;
            background: white;
            border-radius: 4px;
            border-left: 3px solid #764ba2;
        }

        .ayah-transcription {
            color: #4b4b4b;
            margin-bottom: 10px;
            font-size: 0.98em;
            text-align: left;
            direction: ltr;
            font-style: italic;
            padding: 10px;
            background: rgba(255,255,255,0.9);
            border-radius: 6px;
            border: 1px dashed rgba(11,107,79,0.04);
        }

        .ayah-pronunciation {
            color: #2b2b2b;
            margin-bottom: 10px;
            font-size: 1em;
            text-align: left;
            direction: ltr;
            padding: 12px;
            background: linear-gradient(90deg, rgba(201,160,75,0.06), rgba(255,255,255,0.6));
            border-radius: 6px;
            border-left: 4px solid var(--accent);
            font-style: normal;
        }

        .ayah-number {
            display: inline-block;
            width: 35px;
            height: 35px;
            background: #667eea;
            color: white;
            border-radius: 50%;
            text-align: center;
            line-height: 35px;
            font-weight: 600;
            margin-left: 10px;
            font-size: 0.85em;
        }

        .placeholder {
            text-align: center;
            color: #999;
            padding: 50px 20px;
            font-size: 1.1em;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 2px solid #e0e0e0;
        }

        .tab-btn {
            padding: 12px 20px;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1em;
            font-weight: 600;
            color: #999;
            transition: all 0.3s ease;
            border-bottom: 3px solid transparent;
            margin-bottom: -2px;
        }

        .tab-btn.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }

        .tab-btn:hover {
            color: #667eea;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        function renderSurahsList(surahs) {

        function setupSearch() {
            document.getElementById('searchInput').addEventListener('input', (e) => {
                const query = (e.target.value || '').trim().toLowerCase();
                if (!query) {
                    renderSurahsList(allSurahs);
                    return;
                }

                const filtered = allSurahs.filter(surah => {
                    const meta = surahsData[surah.id] || {};
                    const surahName = (surah.name || surah.name_arabic || '').toString();
                    const metaName = (meta.name || '').toString();
                    const translit = (meta.translit || '').toString();

                    return (
                        (metaName && metaName.toLowerCase().includes(query)) ||
                        (surahName && surahName.toLowerCase().includes(query)) ||
                        (translit && translit.toLowerCase().includes(query)) ||
                        surah.id.toString().includes(query)
                    );
                });

                renderSurahsList(filtered);
            });
        }

        function adjustSurahsGridHeight(){
            const grid = document.getElementById('surahsGrid');
            if(!grid) return;
            const mainContent = document.getElementById('mainContent');
            const header = document.querySelector('.header');
            const selector = document.querySelector('.surahs-selector');
            const search = document.querySelector('.search-section');
            const footer = document.querySelector('.footer');

            let used = 0;
            if(header) used += header.offsetHeight;
            if(selector) used += selector.offsetHeight;
            if(search) used += search.offsetHeight;
            if(footer) used += footer.offsetHeight;
            // extra paddings
            used += 60;

            const available = window.innerHeight - used;
            if(mainContent && mainContent.classList.contains('hidden')){
                grid.style.maxHeight = Math.max(120, available) + 'px';
                grid.style.overflowY = 'auto';
            } else {
                // restore default
                grid.style.maxHeight = '';
                grid.style.overflowY = 'auto';
            }
        }

        async function loadSurahContent(chapterNumber) {
            try {
                // Load Arabic text
                const arabicRes = await fetch(`${API_BASE}/quran/verses/uthmani?chapter_number=${chapterNumber}`);
                const arabicData = await arabicRes.json();
                
                // Try to load Russian translation from Quran Cloud API
                let translationMap = translationsDB[chapterNumber] || {};
                try {
                    // Quran Cloud API - Russian translation (Coulson)
                    const cloudRes = await fetch(`https://api.alquran.cloud/v1/surah/${chapterNumber}/ru.kuliev`);
                    if (cloudRes.ok) {
                        const cloudData = await cloudRes.json();
                        cloudData.data?.ayahs?.forEach((ayah, idx) => {
                            const verseNum = ayah.numberInSurah || (idx + 1);
                            translationMap[verseNum] = ayah.text;
                        });
                    }
                } catch (e) {
                    console.log('Quran Cloud API translation fetch failed, using built-in translations');
                    // Will use translationsDB as fallback
                }

                // Try to fetch transliteration (latin) from alquran.cloud and convert to русские буквы
                let translitMapLatin = {};
                try {
                    const transRes = await fetch(`https://api.alquran.cloud/v1/surah/${chapterNumber}/en.transliteration`);
                    if (transRes.ok) {
                        const transData = await transRes.json();
                        transData.data?.ayahs?.forEach((ayah, idx) => {
                            const verseNum = ayah.numberInSurah || (idx + 1);
                            translitMapLatin[verseNum] = ayah.text;
                        });
                    }
                } catch (e) {
                    console.log('Transliteration fetch failed:', e);
                }

                // Convert latin transliteration to approximate Russian letters
                const translitMapRus = {};
                Object.keys(translitMapLatin).forEach(k => {
                    translitMapRus[k] = latinToCyrillic(translitMapLatin[k]);
                });

                // Store globals for later use (toggle view)
                currentTranslitMap = translitMapRus;
                currentArabicVerses = arabicData.verses || [];
                currentTranslationMapGlobal = translationMap || {};

                displayAyahs(arabicData.verses, translationMap, translitMapRus);
            } catch (error) {
                showError('Ошибка при загрузке суры');
                console.error(error);
            }
        }

        // Простая аппроксимация трансформации латинской транслитерации в русские буквы
        function latinToCyrillic(text) {
            if (!text) return '';
            let s = text.toLowerCase();

            // Заменяем наиболее частые сочетания сначала
            const rules = [
                ['sh', 'ш'], ['kh', 'х'], ['gh', 'г'], ['ch', 'ч'], ['th', 'с'], ['dh', 'з'],
                ['aa', 'а'], ['ā', 'а'], ['ī', 'и'], ['ū', 'у'], ['a', 'а'], ['i', 'и'], ['u', 'у'],
                ['e', 'э'], ['o', 'о'], ['y', 'й'], ['q', 'к'], ['j', 'дж'], ['w', 'в'],
            ];

            rules.forEach(([from, to]) => {
                s = s.split(from).join(to);
            });

            // Простейшая замена одиночных латинских букв на кириллицу
            const map = {
                'b':'б','t':'т','d':'д','r':'р','z':'з','s':'с','f':'ф','k':'к','l':'л','m':'м','n':'н','h':'х','p':'п','v':'в','g':'г','c':'к'
            };
            s = s.split('').map(ch => map[ch] || ch).join('');

            // Убираем лишние пробелы и символы
            s = s.replace(/[^а-яё0-9\-\s\.\,\'\"]+/g, '');
            s = s.replace(/\s{2,}/g, ' ').trim();
            return s;
        }

            const youtubeContainer = document.getElementById('youtubeContainer');
            const searchQuery = `${meta.name || surah.name_arabic} коран рецитация`;
            const youtubeUrl = `https://www.youtube.com/results?search_query=${encodeURIComponent(searchQuery)}`;
            
            youtubeContainer.innerHTML = `
                <a href="${youtubeUrl}" target="_blank" rel="noopener noreferrer">
                    🎥 Слушать на YouTube
                </a>
            `;
        }

        function changeReciter() {
            currentReciter = document.getElementById('reciterSelect').value;
            if (currentSurah) {
                loadAudio(currentSurah.id);
            }
        }

        function setupTabButtons() {
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const tabName = btn.dataset.tab;
                    switchTab(tabName);
                    
                    document.querySelectorAll('.tab-btn').forEach(b => {
                        b.classList.remove('active');
                    });
                    btn.classList.add('active');
                });
            });
        }

        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(tab => {
                tab.classList.remove('active');
            });
            document.getElementById(tabName).classList.add('active');
        }

        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.innerHTML = `<div class="error">${message}</div>`;
            setTimeout(() => {
                errorDiv.innerHTML = '';
            }, 5000);
        }
    </script>
</body>
</html>
